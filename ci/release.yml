name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate
        run: npm run validate
      - name: Build installers (SosisLauncherSetup.exe + .msi)
        run: npm run dist
      - name: Generate manifests
        run: node scripts/make-manifest.js
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sosis-launcher-windows
          path: |
            dist/SosisLauncherSetup.exe
            dist/SosisLauncherSetup.msi
            dist/latest.json
            dist/datasetup-manifest.json

  build-web-installer:
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build bootstrapper
        run: npm run installer:bootstrap
      - name: Rename bootstrapper asset
        shell: bash
        run: mv installer/bootstrapper/dist/SosisLauncherSetup.exe installer/bootstrapper/dist/SosisLauncherWebSetup.exe
      - name: Upload bootstrapper
        uses: actions/upload-artifact@v4
        with:
          name: sosis-launcher-web-installer
          path: installer/bootstrapper/dist/SosisLauncherWebSetup.exe

  # Keeps the GitHub Release ALWAYS up to date: every tag push re-publishes
  # the setup EXE + manifests to the release (existing assets are replaced).
  release:
    needs: [build-windows, build-web-installer]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Sosis Launcher ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            artifacts/sosis-launcher-windows/SosisLauncherSetup.exe
            artifacts/sosis-launcher-windows/SosisLauncherSetup.msi
            artifacts/sosis-launcher-windows/latest.json
            artifacts/sosis-launcher-windows/datasetup-manifest.json
            artifacts/sosis-launcher-web-installer/SosisLauncherWebSetup.exe

# NOTE: this workflow is ALSO committed at .github/workflows/release.yml, so a
# `git push` activates it (pushing workflow files requires a token with the
# `workflow` scope). If your token lacks it, push everything except
# .github/workflows, or copy ci/release.yml via the GitHub web UI.
