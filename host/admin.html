<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin | Sosis Launcher</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" href="/assets/icon-64.png" />
<link rel="stylesheet" href="/css/site.css" />
</head>
<body data-page="admin">
<header class="nav"><div class="nav-inner">
  <a class="brand" href="/"><img src="/assets/icon-64.png" alt="" width="30" height="30" /><span>Sosis Launcher</span></a>
  <nav class="links"><span class="muted small" style="padding:8px 12px">Admin Panel</span></nav>
  <button class="lang-btn" id="langBtn">EN</button>
</div></header>

<div class="page-wrap" id="adminLoginWrap">
  <div class="card">
    <h1>🔐 Admin</h1>
    <div class="sub" id="adminSub">دسترسی مدیر — رمز عبور را وارد کنید</div>
    <form id="adminLoginForm">
      <div class="field"><label>Password</label><input id="adminPass" type="password" autocomplete="current-password" required /></div>
      <button class="btn primary" type="submit">Enter</button>
      <div class="form-msg" id="adminLoginMsg"></div>
    </form>
  </div>
</div>

<div class="page-wrap wide hidden" id="adminPanelWrap">
  <div class="admin-grid">
    <div class="admin-tabs" id="adminTabs">
      <button data-tab="publish" class="active">📦 Publish update</button>
      <button data-tab="files">🗂 Files</button>
      <button data-tab="site">⚙ Site & downloads</button>
      <button data-tab="users">👥 Users</button>
      <button data-tab="security">🔑 Security</button>
      <button id="adminLogout">🚪 Logout</button>
    </div>
    <div class="panel" id="adminContent"></div>
  </div>
</div>

<script src="/js/site.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
