<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ثبت‌نام | Sosis Launcher</title>
<meta name="robots" content="noindex, follow" />
<link rel="icon" type="image/png" href="/assets/icon-64.png" />
<link rel="stylesheet" href="/css/site.css" />
</head>
<body data-page="register">
<header class="nav"><div class="nav-inner">
  <a class="brand" href="/"><img src="/assets/icon-64.png" alt="" width="30" height="30" /><span>Sosis Launcher</span></a>
  <nav class="links"><a href="/leaderboard.html" data-i18n="nav.leaderboard">لیدربورد</a><a href="/login.html" data-i18n="nav.login">ورود</a></nav>
  <button class="lang-btn" id="langBtn">EN</button>
</div></header>
<div class="page-wrap">
  <div class="card">
    <h1 data-i18n="auth.registerTitle">ساخت حساب کاربری</h1>
    <div class="sub">Sosis Launcher — app.sosis-shop.top</div>
    <form id="authForm">
      <div class="field"><label data-i18n="auth.username">نام کاربری</label><input id="username" autocomplete="username" required minlength="3" maxlength="24" /></div>
      <div class="field"><label data-i18n="auth.email">ایمیل (اختیاری)</label><input id="email" type="email" autocomplete="email" /></div>
      <div class="field"><label data-i18n="auth.password">رمز عبور</label><input id="password" type="password" autocomplete="new-password" required minlength="6" /></div>
      <button class="btn primary" type="submit" data-i18n="auth.registerBtn">ثبت‌نام</button>
      <div class="form-msg" id="authMsg"></div>
    </form>
    <p class="small muted"><a href="/login.html" data-i18n="auth.toLogin">حساب دارید؟ وارد شوید</a></p>
  </div>
</div>
<script src="/js/site.js"></script>
</body>
</html>
