; cPanel shared hosting (CGI/FPM) PHP limits for big uploads (installer + game files up to 2GB).
; If your host ignores .user.ini, set the same values in
; cPanel -> MultiPHP INI Editor.
upload_max_filesize = 2200M
post_max_size = 2200M
max_execution_time = 1200
memory_limit = 256M
file_uploads = On
